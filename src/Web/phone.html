<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>AutoApply</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#232b36;--tx:#e6edf3;--tx2:#9aa7b4;--tx3:#6b7885;--jade:#34d399;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.brand{font-size:20px;font-weight:600;letter-spacing:.2px}
.brand small{font-size:11px;color:var(--tx3);font-weight:400;margin-left:6px}
.state{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);display:inline-block}
.dot.on{background:var(--jade);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.dot.run{background:var(--warn);box-shadow:0 0 0 3px rgba(245,158,11,.15);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px}
.kpi .lab{font-size:11px;color:var(--tx3);display:block}
.kpi .val{font-size:22px;font-weight:600;letter-spacing:.3px}
.sites{display:flex;flex-direction:column;gap:10px}
.site{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.site .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.site .nm{font-size:16px;font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--tx2)}
.tag.ok{color:var(--jade);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.tag.warn{color:var(--warn);border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.08)}
.tag.bad{color:var(--bad);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.site .meta{font-size:13px;color:var(--tx2);display:flex;flex-wrap:wrap;gap:4px 14px}
.site .note{font-size:12px;color:var(--warn);margin-top:7px}
.site .note.quiet{color:var(--tx3)}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:12px 14px}
.log h3{font-size:12px;color:var(--tx3);font-weight:500;margin:0 0 6px}
.log pre{margin:0;font:11.5px/1.6 ui-monospace,Consolas,monospace;color:var(--tx2);white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:auto}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:8px;background:linear-gradient(180deg,rgba(13,17,23,0),rgba(13,17,23,.94) 26%,var(--bg) 55%)}
button{border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px;padding:13px 10px;font-family:inherit}
button:active{transform:scale(.985);opacity:.85}
button.primary{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:var(--jade);font-weight:600}
button.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45);color:#fca5a5}
button[disabled]{opacity:.4}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2937;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--tx);opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">AutoApply <small id="ver"></small></div>
  <div class="state"><i class="dot" id="dot"></i><span id="stateText">连接中…</span></div>
</header>

<section class="kpis">
  <div class="kpi"><span class="lab">今天投递</span><span class="val" id="today">–</span></div>
  <div class="kpi"><span class="lab">本轮</span><span class="val" id="sent">–</span></div>
  <div class="kpi"><span class="lab">待处理</span><span class="val" id="issues">–</span></div>
  <div class="kpi"><span class="lab">标签页</span><span class="val" id="tabs">–</span></div>
</section>

<section class="sites" id="sites"></section>

<section class="log"><h3>运行日志（最后几行）</h3><pre id="log">—</pre></section>

<div class="bar">
  <button id="bRefresh">刷新一下</button>
  <button id="bReopen">全部重开</button>
  <button id="bStart" class="primary">开始一轮</button>
  <button id="bStop" class="danger hide">停止本轮</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var timer = null, busy = false;

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.className = 'toast show';
    clearTimeout(t._h); t._h = setTimeout(function(){ t.className = 'toast'; }, 2200);
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function loginText(v){ return v === 'yes' ? '已登录' : v === 'no' ? '未登录' : '无法判断'; }
  function loginCls(v){ return v === 'yes' ? 'ok' : v === 'no' ? 'bad' : 'warn'; }

  function render(s){
    $('ver').textContent = s.ver || '';
    var d = $('dot'), st = $('stateText');
    d.className = 'dot' + (s.running ? ' run' : (s.chrome ? ' on' : ''));
    st.textContent = s.running ? ('投递中 · ' + (s.site || s.stage || '准备')) : (s.chrome ? '待命 · 浏览器已连' : '待命 · 浏览器未开');
    $('today').textContent = s.today;
    $('sent').textContent = s.sent;
    $('tabs').textContent = s.tabs;
    $('issues').textContent = s.issues;
    $('issues').style.color = s.issues > 0 ? 'var(--warn)' : 'var(--jade)';

    var html = '';
    for (var i = 0; i < s.sites.length; i++){
      var x = s.sites[i];
      var badge = x.login === 'unknown'
        ? '<span class="tag warn">无法判断</span>'
        : '<span class="tag ' + loginCls(x.login) + '">' + loginText(x.login) + '</span>';
      var note = x.note ? '<div class="note' + (x.note === '正常' ? ' quiet' : '') + '">' + esc(x.note) + '</div>' : '';
      html += '<div class="site"><div class="top"><span class="nm">' + esc(x.name) + '</span>' + badge +
        (x.captcha ? '<span class="tag bad">有验证码</span>' : '') +
        (x.enabled ? '' : '<span class="tag">已停用</span>') + '</div>' +
        '<div class="meta"><span>' + x.tabs + ' 个标签页</span><span>今天 ' + x.today + ' 条</span><span>' + esc(x.lastRound) + '</span></div>' +
        note + '</div>';
    }
    $('sites').innerHTML = html;
    $('log').textContent = (s.log || []).join('\n') || '—';

    $('bStart').disabled = !!s.running;
    $('bReopen').disabled = !!s.running;
    $('bStart').classList.toggle('hide', !!s.running);
    $('bStop').classList.toggle('hide', !s.running);
  }

  function load(){
    fetch('/api/state', {cache:'no-store'}).then(function(r){
      if (r.status === 401){ location = '/'; return null; }
      return r.json();
    }).then(function(s){ if (s) render(s); }).catch(function(){ $('stateText').textContent = '连不上电脑…'; });
  }

  function act(a){
    if (busy) return;
    if (a === 'start' && !confirm('现在在电脑上开始一轮投递？')) return;
    if (a === 'reopenall' && !confirm('重开四个站点的标签页？（登录态不会丢）')) return;
    busy = true;
    fetch('/api/action?a=' + a, {method:'POST', cache:'no-store'}).then(function(r){
      return r.json().catch(function(){ return {}; });
    }).then(function(j){
      busy = false;
      toast(j.msg || '已提交，等几秒看状态');
      setTimeout(load, 800);
    }).catch(function(){ busy = false; toast('没发出去，检查电脑是否还在跑'); });
  }

  $('bRefresh').onclick = function(){ load(); toast('已刷新'); };
  $('bReopen').onclick = function(){ act('reopenall'); };
  $('bStart').onclick = function(){ act('start'); };
  $('bStop').onclick = function(){ act('stop'); };

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ load(); }
  });
  load();
  timer = setInterval(function(){ if (!document.hidden) load(); }, 5000);
})();
</script>
</body>
</html>
